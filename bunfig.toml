[test]
# e2e/*.spec.js are Playwright tests, so limit bun test to test/
root = "./test"

[fmt]
# Options for bun fmt (Prettier-compatible)
singleQuote = true
arrowParens = "avoid"
semi = true
tabWidth = 2
# Icons and E2E snapshots must match the generated output, so they are not formatted
ignorePatterns = ["icons/", "e2e/__snapshots__/"]
