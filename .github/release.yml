changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    # Listed first so that a PR labeled both "new-icon" and "feature" goes here.
    - title: 🎨 New Icons
      labels:
        - new-icon
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔧 Chores
      labels:
        - chore
    - title: Other Changes
      labels:
        - '*'
